<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="auth-page">
        <div class="card">
            <form id="loginForm">
                <label>
                    Email
                    <input id="email" type="email" placeholder="admin@mail.com" required>
                </label>
                <label>
                    Пароль
                    <input id="password" type="password" placeholder="123456" required>
                </label>
                <button type="submit">
                    Войти
                </button>
            </form>
            <p id="message"></p>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
